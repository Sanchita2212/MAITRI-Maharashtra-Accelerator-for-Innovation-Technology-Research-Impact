services:
  - type: web
    name: maitri-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: cd backend && python -m app.seed.seed_database && python -m app.seed.seed_chroma && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite:///./maitri.db
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: maitri-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: maitri-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false

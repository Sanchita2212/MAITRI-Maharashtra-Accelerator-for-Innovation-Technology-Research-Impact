services:
  - type: web
    name: maitri-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite:///./maitri.db
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: maitri-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: maitri-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: maitri-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html